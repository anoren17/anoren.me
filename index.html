  <script>
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- Wordmark: a light follows the pointer inside the lettering, and the word tilts toward it.
    (() => {
      if (calm) return;
      const h1 = document.querySelector('.hero h1');
      let px = 0, py = 0, inside = false;
      let sx = 0, sy = 0, spot = 0;            // the light (smoothed)
      let rx = 0, ry = 0, tx = 0, ty = 0;      // tilt: current and target, in degrees
      let raf = 0, last = 0;

      function frame(now) {
        raf = 0;
        const k = 1 - Math.pow(0.86, Math.min(50, now - last) / 16.7);   // frame-rate independent easing
        last = now;
        const goal = inside ? 1 : 0;
        spot += (goal - spot) * k;
        if (inside) { sx += (px - sx) * Math.min(1, k * 1.6); sy += (py - sy) * Math.min(1, k * 1.6); }
        rx += (tx - rx) * k; ry += (ty - ry) * k;
        h1.style.setProperty('--mx', sx.toFixed(1) + 'px');
        h1.style.setProperty('--my', sy.toFixed(1) + 'px');
        h1.style.setProperty('--spot', spot.toFixed(3));
        h1.style.setProperty('--rx', rx.toFixed(2) + 'deg');
        h1.style.setProperty('--ry', ry.toFixed(2) + 'deg');
        const busy = Math.abs(goal - spot) > 0.004 || Math.abs(tx - rx) > 0.02 || Math.abs(ty - ry) > 0.02
          || (inside && Math.hypot(px - sx, py - sy) > 0.5);
        if (busy) raf = requestAnimationFrame(frame);
      }
      const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };

      function move(e) {
        const w = h1.offsetWidth, h = h1.offsetHeight;
        const r = h1.getBoundingClientRect();
        px = (e.clientX - r.left) / r.width * w;      // back to the element's own (untilted) coordinates
        py = (e.clientY - r.top) / r.height * h;
        const was = inside;
        inside = px > 0 && px < w && py > 0 && py < h;
        if (inside && !was && spot < 0.02) { sx = px; sy = py; }   // the light appears under the pointer
        tx = inside ? -(py / h - 0.5) * 9 : 0;
        ty = inside ? (px / w - 0.5) * 12 : 0;
        kick();
      }
      function away() { inside = false; tx = ty = 0; kick(); }

      addEventListener('pointermove', move, { passive: true });
      addEventListener('pointerdown', move, { passive: true });
      addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') away(); }, { passive: true });
      addEventListener('pointercancel', away, { passive: true });
      document.documentElement.addEventListener('pointerleave', away);
      addEventListener('blur', away);
    })();

    // ---- Music tile: the bars swell under the pointer.
    (() => {
      const tile = document.querySelector('.tile-music');
      const wrap = tile.querySelector('.bars');
      const bars = [...wrap.children];
      const hs = bars.map(b => parseFloat(b.style.getPropertyValue('--h')) / 100);
      tile.addEventListener('pointermove', e => {
        const r = wrap.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        bars.forEach((b, i) => {
          const p = Math.max(0, 1 - Math.abs((i + 0.5) / bars.length - x) / 0.2);
          const q = p * p * (3 - 2 * p);
          b.style.setProperty('--s', (1 + q * (1 / hs[i] - 1)).toFixed(3));
          b.style.setProperty('--t', q.toFixed(3));
        });
      }, { passive: true });
      const rest = () => bars.forEach(b => { b.style.setProperty('--s', 1); b.style.setProperty('--t', 0); });
      tile.addEventListener('pointerleave', rest);
      tile.addEventListener('pointercancel', rest);
    })();

    // ---- Cooking tile: slow crossfade through a few plates (each loaded only when needed).
    (() => {
      const picks = [18, 37, 30, 41, 4, 28, 24];
      const box = document.getElementById('cookTile');
      if (!box || calm) return;
      let i = 0;
      setInterval(() => {
        if (document.hidden) return;
        const n = picks[(i + 1) % picks.length];
        const img = new Image();
        img.alt = '';
        img.onload = () => {
          const old = box.querySelector('img.on');
          box.appendChild(img);
          void img.offsetWidth;          // commit the starting opacity so the fade runs
          img.classList.add('on');
          if (old) { old.classList.remove('on'); setTimeout(() => old.remove(), 1400); }
          i++;
        };
        img.src = `assets/cooking/img-${String(n).padStart(2, '0')}.jpg`;
      }, 5000);
    })();
  </script>
