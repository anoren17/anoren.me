<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooking — Anoren</title>
  <meta name="description" content="Plates from the pan." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#F5F7FC" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Onest:wght@400..700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script src="site.js"></script>
  <link rel="prefetch" href="index.html" />
  <link rel="prefetch" href="music.html" />
  <link rel="prefetch" href="poker.html" />
</head>
<body class="page-cooking">

  <header class="nav">
    <a class="wordmark" href="index.html">Anoren</a>
    <nav class="nav-links">
      <a href="cooking.html" aria-current="page">Cooking</a>
      <a href="music.html">Music</a>
      <a href="poker.html">Poker</a>
    </nav>
  </header>

  <main class="shell cook">

    <header class="page-head">
      <h1>Cooking</h1>
    </header>

    <div class="stage" id="stage" aria-roledescription="carousel" aria-label="Cooking photos"></div>

    <div class="cook-controls reveal">
      <div class="car-controls">
        <button class="car-btn" id="prev" aria-label="Previous photo">‹</button>
        <button class="car-btn" id="next" aria-label="Next photo">›</button>
        <span class="car-counter"><b id="cur">01</b> / <span id="total">41</span></span>
        <button class="car-toggle" id="toggle">Pause</button>
      </div>
      <div class="progress"><i id="bar"></i></div>
    </div>

    <div class="thumbs" id="thumbs"></div>

  </main>

  <footer class="footer">
    <span>anoren.me</span>
  </footer>

  <script>
    // Photos live in assets/cooking/img-NN.jpg, with small copies in assets/cooking/thumbs/.
    const N = 41;
    const HOLD = 4200;   // ms per photo while playing

    const pad  = n => String(n).padStart(2, '0');
    const full = i => `assets/cooking/img-${pad(i + 1)}.jpg`;
    const tiny = i => `assets/cooking/thumbs/img-${pad(i + 1)}.jpg`;

    const stage  = document.getElementById('stage');
    const thumbs = document.getElementById('thumbs');
    const curEl  = document.getElementById('cur');
    const bar    = document.getElementById('bar');
    const toggle = document.getElementById('toggle');

    document.getElementById('total').textContent = pad(N);
    document.documentElement.style.setProperty('--hold', HOLD + 'ms');

    const slides = [], tbtns = [];
    for (let i = 0; i < N; i++) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.style.setProperty('--bg', `url("${tiny(i)}")`);
      const img = document.createElement('img');
      img.alt = `Plate ${i + 1}`;
      img.decoding = 'async';
      slide.appendChild(img);
      stage.appendChild(slide);
      slides.push(slide);

      const t = document.createElement('button');
      t.setAttribute('aria-label', `Photo ${i + 1}`);
      const ti = document.createElement('img');
      ti.loading = 'lazy';
      ti.alt = '';
      ti.onerror = () => { ti.onerror = null; ti.src = full(i); };  // no thumb yet → use the full photo
      ti.src = tiny(i);
      t.appendChild(ti);
      t.addEventListener('click', () => go(i, i < idx ? -1 : 1));
      thumbs.appendChild(t);
      tbtns.push(t);
    }

    // Full-size photos load only when they're about to be shown.
    const load = i => {
      const img = slides[(i + N) % N].firstChild;
      if (!img.src) img.src = full((i + N) % N);
    };

    let idx = 0;
    let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;

    function restartBar() {
      bar.classList.remove('run');
      void bar.offsetWidth;            // restart the CSS animation
      if (playing) bar.classList.add('run');
    }

    // dir: +1 = moving forward (new photo drifts in from the right), -1 = back
    function go(n, dir = 1) {
      const old = slides[idx];
      tbtns[idx].classList.remove('active');
      idx = (n + N) % N;
      load(idx); load(idx + 1); load(idx - 1);
      stage.style.setProperty('--dir', dir);
      if (old !== slides[idx]) {
        void slides[idx].offsetWidth;                    // start the new slide from its off-side position
        old.classList.remove('active');
        old.classList.add('leaving');
        setTimeout(() => old.classList.remove('leaving'), 900);
      }
      slides[idx].classList.remove('leaving');
      slides[idx].classList.add('active');
      tbtns[idx].classList.add('active');
      curEl.textContent = pad(idx + 1);
      curEl.classList.remove('tick'); void curEl.offsetWidth; curEl.classList.add('tick');
      restartBar();
    }

    function setPlaying(on) {
      playing = on;
      toggle.textContent = playing ? 'Pause' : 'Play';
      stage.classList.toggle('paused', !playing);
      restartBar();
    }

    bar.addEventListener('animationend', () => go(idx + 1, 1));
    toggle.addEventListener('click', () => setPlaying(!playing));
    const prev = () => go(idx - 1, -1);
    const next = () => go(idx + 1, 1);
    document.getElementById('prev').addEventListener('click', prev);
    document.getElementById('next').addEventListener('click', next);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === ' ' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
    });

    // On the photo: swipe, or click the left / right half.
    let x0 = null;
    const leftHalf = e => { const r = stage.getBoundingClientRect(); return e.clientX - r.left < r.width / 2; };
    stage.addEventListener('pointerdown', e => { x0 = e.clientX; });
    stage.addEventListener('pointerup', e => {
      if (x0 === null) return;
      const dx = e.clientX - x0;
      x0 = null;
      if (Math.abs(dx) > 40) (dx < 0 ? next : prev)();
      else if (Math.abs(dx) < 8) (leftHalf(e) ? prev : next)();
    });
    stage.addEventListener('pointercancel', () => { x0 = null; });
    stage.addEventListener('pointermove', e => { stage.style.cursor = leftHalf(e) ? 'w-resize' : 'e-resize'; }, { passive: true });

    setPlaying(playing);
    go(0);
  </script>

</body>
</html>
