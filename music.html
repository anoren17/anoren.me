<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music — Anoren</title>
  <meta name="description" content="On repeat." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#F5F7FC" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Onest:wght@400..700&display=swap" />

  <link rel="prefetch" href="index.html" />

  <link rel="prefetch" href="poker.html" />
</head>
<body class="page-music">

  <header class="nav">
    <a class="wordmark" href="index.html">Anoren</a>
    <nav class="nav-links">
      <a href="cooking.html">Cooking</a>
      <a href="music.html" aria-current="page">Music</a>
      <a href="poker.html">Poker</a>
    </nav>
  </header>

  <main class="shell">

    <header class="page-head">
      <h1>Music</h1>
      <p class="sub reveal">The songs I can't stop playing.</p>
    </header>

    <section class="player">
      <div class="player-main">
        <div class="stage" id="stage" aria-roledescription="carousel" aria-label="Music"></div>
        <div class="car-controls reveal">
          <button class="car-btn" id="prev" aria-label="Previous">‹</button>
          <button class="car-btn" id="next" aria-label="Next">›</button>
          <span class="car-counter"><b id="cur">01</b> / <span id="total">42</span></span>
        </div>
      </div>
      <div class="playlist-wrap reveal">
        <ol class="playlist" id="thumbs"></ol>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span>anoren.me</span>
  </footer>

  <script>
    // a = Amazon Music [asin, id, height, title]; y = YouTube [videoId, title];
    // n = note [date, text]; h = heading [html]
    const items = [
      ['a', 'B01N6J9HCO', '7gZBEe5QaF', 352, 'Kina Chir'],
      ['y', 'oRZ0cfZ9SeU', 'Vilen — Ek Raat'],
      ['a', 'B094MQK737', '5H4tipmXvo', 390, '3:15 (Breathe)'],
      ['a', 'B07X83TF2P', 'GInRR19YJd', 390, 'love nwantiti'],
      ['a', 'B0B7B1RRLM', 'AIKngnm9yP', 390, 'Safar'],
      ['a', 'B074QFMHBY', 'XdwDycClsy', 390, 'Chand Sifarish'],
      ['a', 'B09V6DP45M', 'WjG2QlesYQ', 390, 'this is what heartbreak feels like'],
      ['a', 'B000WLMMBW', '3qctVWmDTv', 390, 'Lonely'],
      ['a', 'B002EHTTHW', 'gTva9E4JBY', 390, 'Numb'],
      ['a', 'B002A5ZD96', 'Fop6qulavJ', 390, 'Fairytale'],
      ['a', 'B001NZXFFI', 'AvF3BH4tT6', 390, 'Bandoleros'],
      ['n', '5/17', ''],
      ['a', 'B0B5LBDK7R', 'DhWzxtrLec', 390, 'она звонила мне'],
      ['n', '2/22', ''],
      ['a', 'B096LFPB89', '9V4ho6MjHO', 390, 'Detstvo'],
      ['n', '1/29', ''],
      ['a', 'B0BKYYFCFR', 'JfX392Yvp5', 390, 'Childhood'],
      ['n', '1/27', ''],
      ['a', 'B01MSIOX2M', 'feVjg394T3', 390, 'Intro (Infected)'],
      ['n', '1/11', 'Gonna be on repeat next few days'],
      ['y', 'vSINZsLxs8k', 'Sickick — Infected'],
      ['a', 'B0791J764L', 'nQDwW3ERzG', 390, 'Aap Ki Nazron Ne Samjha'],
      ['a', 'B0BHTGLFBQ', '2pQTjCVt5G', 390, 'Moonlight'],
      ['n', '11/26', 'On repeat today ¯\\_(ツ)_/¯. One hell of a day, full of stress and high levels of cortisol.'],
      ['a', 'B0758XZ5XG', '0znkbFgYTB', 390, 'Drowning'],
      ['a', 'B09NLD8Q9D', 'NEfjMIgSSC', 390, 'The Perfect Girl'],
      ['a', 'B095F7BRBJ', 'ggMoFuL6Hm', 390, 'Blood & Water'],
      ['n', '', "But blood's not thicker than water after all"],
      ['a', 'B01BM5MW2K', 'BlzTWR3Vku', 600, 'XXXTentacion'],
      ['a', 'B09SJSVZS7', 'CWWuS0lmwm', 600, 'Metamorphosed'],
      ['n', '10/22', 'Respiration is my top repeat song these days.'],
      ['h', 'Evolution of <em>Petrunko</em>'],
      ['y', 'Skhaf0yQrQc', 'The Great Voices of Bulgaria — Bre Petrunko'],
      ['y', 'dD4oeEvL_sw', 'Petrunko Remix by FanEOne (Bass Boosted)'],
      ['y', 'vS3KVq_xjMo', 'Petrunko Remix by FanEOne — Rolls Royce'],
      ['y', '0HL-N9oOjcs', 'Evolution of Petrunko (English version)'],
      ['y', 'pF1pKFiGXYw', "t.A.T.u. — Ne Ver', Ne Boysya, Ne Prosi"],
      ['n', '10/8', 'On repeat'],
      ['y', 'YLHpvjrFpe0', 'Linkin Park — From the Inside'],
      ['n', '10/18', ''],
      ['y', 'Z0z9BawyNLQ', 'Dido — White Flag'],
      ['n', '10/19', '']
    ];

    const N = items.length;
    const stage = document.getElementById('stage');
    const list  = document.getElementById('thumbs');
    const curEl = document.getElementById('cur');
    const pad   = n => String(n).padStart(2, '0');
    document.getElementById('total').textContent = pad(N);

    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const isEmbed = it => it[0] === 'a' || it[0] === 'y';

    function amazonSrc(asin, id) {
      return `https://music.amazon.com/embed/${asin}/?id=${id}&marketplaceId=ATVPDKIKX0DER&musicTerritory=US`;
    }
    function youtubeSrc(vid) {
      return `https://www.youtube.com/embed/${vid}`;
    }

    // Embeds are created when their slide is shown and removed when it's left (which stops playback).
    function mountEmbed(slide, it) {
      const wrap = document.createElement('div');
      const iframe = document.createElement('iframe');
      if (it[0] === 'a') {
        wrap.className = 'sl-embed-wrap';
        iframe.src = amazonSrc(it[1], it[2]);
        iframe.height = it[3];
        iframe.title = it[4] || 'Amazon Music';
      } else {
        wrap.className = 'sl-embed-wrap sl-yt';
        iframe.src = youtubeSrc(it[1]);
        iframe.title = it[2];
        iframe.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
      }
      wrap.appendChild(iframe);
      slide.appendChild(wrap);
    }

    // decorative equalizer along the bottom of the stage
    const eq = document.createElement('div');
    eq.className = 'stage-bars';
    eq.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 36; i++) {
      const b = document.createElement('i');
      b.style.setProperty('--h', (30 + 70 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.6))).toFixed(0) + '%');
      b.style.setProperty('--d', (-((i * 290) % 1900)) + 'ms');
      eq.appendChild(b);
    }
    stage.appendChild(eq);

    // the highlight that glides to the active playlist row
    const pill = document.createElement('li');
    pill.className = 'pl-pill';
    pill.setAttribute('role', 'presentation');
    list.appendChild(pill);

    const slides = [], rows = [];
    items.forEach((it, i) => {
      const type = it[0];

      const slide = document.createElement('div');
      slide.className = 'slide';
      if (type === 'n') {
        const [, date, text] = it;
        slide.classList.add('slide-note');
        slide.innerHTML =
          (date ? `<span class="sn-date">${esc(date)}</span>` : '') +
          (text ? `<p class="sn-text">${esc(text)}</p>` : '');
      } else if (type === 'h') {
        slide.classList.add('slide-heading');
        slide.innerHTML = `<div class="sh-text">${it[1]}</div>`;
      }
      stage.appendChild(slide);
      slides.push(slide);

      // playlist row
      const li = document.createElement('li');
      const b  = document.createElement('button');
      if (type === 'a' || type === 'y') li.className = 'pl-track';
      if (type === 'a') {
        b.innerHTML = `<span class="pl-kind">♫</span><span class="pl-title">${esc(it[4] || '')}</span>`;
      } else if (type === 'y') {
        b.innerHTML = `<span class="pl-kind">▶&#xFE0E;</span><span class="pl-title">${esc(it[2])}</span>`;
      } else if (type === 'n') {
        li.className = 'pl-note';
        b.innerHTML = `<span class="pl-kind">${esc(it[1] || '—')}</span><span class="pl-title">${esc(it[2])}</span>`;
      } else {
        li.className = 'pl-head';
        b.textContent = it[1].replace(/<[^>]*>/g, '');
      }
      b.addEventListener('click', () => go(i));
      li.appendChild(b);
      list.appendChild(li);
      rows.push(b);
    });

    let idx = 0;

    function go(n, first) {
      if (!first) {
        const old = slides[idx].querySelector('.sl-embed-wrap');
        if (old) old.remove();
        slides[idx].classList.remove('active');
        rows[idx].classList.remove('active');
        rows[idx].removeAttribute('aria-current');
      }
      idx = (n + N) % N;
      if (isEmbed(items[idx])) mountEmbed(slides[idx], items[idx]);
      slides[idx].classList.add('active');
      rows[idx].classList.add('active');
      rows[idx].setAttribute('aria-current', 'true');
      curEl.textContent = pad(idx + 1);
      if (!first) { curEl.classList.remove('tick'); void curEl.offsetWidth; curEl.classList.add('tick'); }

      // glide the highlight to the active row, and keep that row visible without scrolling the page
      const r = rows[idx], top = r.offsetTop, bottom = top + r.offsetHeight;
      if (first) pill.style.transition = 'none';
      pill.style.height = r.offsetHeight + 'px';
      pill.style.transform = `translateY(${top}px)`;
      if (first) { void pill.offsetWidth; pill.style.transition = ''; }
      if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) {
        list.scrollTo({ top: top - list.clientHeight / 2 + r.offsetHeight / 2, behavior: first ? 'auto' : 'smooth' });
      }
    }

    document.getElementById('prev').addEventListener('click', () => go(idx - 1));
    document.getElementById('next').addEventListener('click', () => go(idx + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(idx + 1);
      if (e.key === 'ArrowLeft')  go(idx - 1);
    });

    go(0, true);
    addEventListener('resize', () => { const r = rows[idx]; pill.style.height = r.offsetHeight + 'px'; pill.style.transform = `translateY(${r.offsetTop}px)`; });
  </script>

</body>
</html>
